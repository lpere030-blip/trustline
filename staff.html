<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Staff Dashboard</title>

  <style>

    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Segoe UI, sans-serif;
      background:#f4f6f9;
      color:#1a1a2e;
      padding:30px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
    }

    h1{
      font-size:28px;
    }

    .logout-btn{
      background:#dc2626;
      color:white;
      border:none;
      padding:10px 18px;
      border-radius:8px;
      cursor:pointer;
      font-weight:600;
    }

    .logout-btn:hover{
      background:#b91c1c;
    }

    .stats{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:15px;
      margin-bottom:25px;
    }

    .card{
      background:white;
      border-radius:14px;
      padding:20px;
      border:1px solid #e5e7eb;
      box-shadow:0 2px 5px rgba(0,0,0,0.03);
    }

    .stat-number{
      font-size:34px;
      font-weight:700;
      margin-bottom:5px;
    }

    .stat-label{
      color:#6b7280;
      font-size:14px;
    }

    .reports-title{
      font-size:18px;
      margin-bottom:15px;
      font-weight:600;
    }

    .report{
      background:white;
      border-radius:14px;
      padding:18px;
      margin-bottom:15px;
      border:1px solid #e5e7eb;
    }

    .report-top{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
      flex-wrap:wrap;
      gap:10px;
    }

    .badge{
      padding:5px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:600;
    }

    .badge-new{
      background:#fee2e2;
      color:#b91c1c;
    }

    .badge-resolved{
      background:#dcfce7;
      color:#15803d;
    }

    .report-info{
      color:#6b7280;
      font-size:13px;
      margin-bottom:10px;
    }

    .resolve-btn{
      margin-top:12px;
      padding:8px 14px;
      border:none;
      border-radius:8px;
      background:#1a1a2e;
      color:white;
      cursor:pointer;
    }

    .resolve-btn:hover{
      background:#2d2d4e;
    }

  </style>
</head>

<body>

  <div class="topbar">

    <h1>Staff Dashboard</h1>

    <button class="logout-btn" onclick="logout()">
      Logout
    </button>

  </div>

  <div class="stats">

    <div class="card">
      <div class="stat-number" id="totalReports">3</div>
      <div class="stat-label">Total Reports</div>
    </div>

    <div class="card">
      <div class="stat-number" style="color:#b91c1c;" id="newReports">2</div>
      <div class="stat-label">Need Review</div>
    </div>

    <div class="card">
      <div class="stat-number" style="color:#15803d;" id="resolvedReports">1</div>
      <div class="stat-label">Resolved</div>
    </div>

  </div>

  <div class="reports-title">
    Recent Reports
  </div>

  <div id="reportsContainer"></div>

<script>

  // EXTRA PASSWORD PROTECTION
  // If someone opens staff.html directly

  const access = prompt("Enter staff access code:");

  if(access !== "tungsahur"){

    alert("Access denied.");

    window.location.href = "index.html";
  }

  // SAMPLE REPORTS

  let reports = [

    {
      id:1,
      type:"Cyberbullying",
      location:"Instagram",
      desc:"Mean messages being sent online.",
      status:"new",
      time:"2 hours ago"
    },

    {
      id:2,
      type:"Verbal Harassment",
      location:"Hallway",
      desc:"Students insulting another student.",
      status:"new",
      time:"45 mins ago"
    },

    {
      id:3,
      type:"Social Exclusion",
      location:"Cafeteria",
      desc:"Student being excluded daily.",
      status:"resolved",
      time:"Yesterday"
    }

  ];

  // RENDER REPORTS

  function renderReports(){

    const container =
      document.getElementById("reportsContainer");

    const newCount =
      reports.filter(r => r.status === "new").length;

    const resolvedCount =
      reports.filter(r => r.status === "resolved").length;

    document.getElementById("totalReports").textContent =
      reports.length;

    document.getElementById("newReports").textContent =
      newCount;

    document.getElementById("resolvedReports").textContent =
      resolvedCount;

    container.innerHTML = reports.map(report => `

      <div class="report">

        <div class="report-top">

          <strong>${report.type}</strong>

          <span class="badge ${
            report.status === "new"
            ? "badge-new"
            : "badge-resolved"
          }">

            ${
              report.status === "new"
              ? "Needs Review"
              : "Resolved"
            }

          </span>

        </div>

        <div class="report-info">
          ${report.location} • ${report.time}
        </div>

        <div>
          ${report.desc}
        </div>

        ${
          report.status === "new"
          ? `
            <button
              class="resolve-btn"
              onclick="resolveReport(${report.id})">
              Mark Resolved
            </button>
          `
          : ""
        }

      </div>

    `).join("");

  }

  // RESOLVE REPORT

  function resolveReport(id){

    const report =
      reports.find(r => r.id === id);

    if(report){

      report.status = "resolved";

      renderReports();
    }

  }

  // LOGOUT

  function logout(){

    window.location.href = "index.html";

  }

  // INITIAL LOAD

  renderReports();

</script>

</body>
</html>
