<script type="module">

  // FIREBASE IMPORTS

  import { initializeApp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  import {
    getFirestore,
    collection,
    getDocs,
    updateDoc,
    doc
  }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // FIREBASE CONFIG

  const firebaseConfig = {

    apiKey: "PASTE_API_KEY",

    authDomain: "PASTE_AUTH_DOMAIN",

    projectId: "PASTE_PROJECT_ID",

    storageBucket: "PASTE_STORAGE_BUCKET",

    messagingSenderId: "PASTE_SENDER_ID",

    appId: "PASTE_APP_ID"

  };

  // START FIREBASE

  const app = initializeApp(firebaseConfig);

  const db = getFirestore(app);

  // STAFF PASSWORD

  const access = prompt("Enter staff access code:");

  if(access !== "tungsahur"){

    alert("Access denied.");

    window.location.href = "index.html";

  }

  // REPORT ARRAY

  let reports = [];

  // LOAD REPORTS

  async function loadReports(){

    const querySnapshot =
      await getDocs(collection(db, "reports"));

    reports = [];

    querySnapshot.forEach((docSnap) => {

      reports.push({

        firebaseId: docSnap.id,

        ...docSnap.data()

      });

    });

    renderReports();

  }

  // RENDER REPORTS

  function renderReports(){

    const container =
      document.getElementById("reportsContainer");

    const newCount =
      reports.filter(r => r.status === "new").length;

    const resolvedCount =
      reports.filter(r => r.status === "resolved").length;

    document.getElementById("totalReports").textContent =
      reports.length;

    document.getElementById("newReports").textContent =
      newCount;

    document.getElementById("resolvedReports").textContent =
      resolvedCount;

    // IF NO REPORTS

    if(reports.length === 0){

      container.innerHTML = `
        <div class="report">
          No reports submitted yet.
        </div>
      `;

      return;

    }

    container.innerHTML = reports.map(report => `

      <div class="report">

        <div class="report-top">

          <strong>${report.type}</strong>

          <span class="badge ${
            report.status === "new"
            ? "badge-new"
            : "badge-resolved"
          }">

            ${
              report.status === "new"
              ? "Needs Review"
              : "Resolved"
            }

          </span>

        </div>

        <div class="report-info">
          ${report.location} • ${report.time}
        </div>

        <div style="margin-bottom:10px;">
          ${report.desc}
        </div>

        <div class="report-info">
          Submitted by: ${report.name}
        </div>

        ${
          report.status === "new"
          ? `
            <button
              class="resolve-btn"
              onclick="resolveReport('${report.firebaseId}')">
              Mark Resolved
            </button>
          `
          : ""
        }

      </div>

    `).join("");

  }

  // RESOLVE REPORT

  window.resolveReport = async function(firebaseId){

    const reportRef =
      doc(db, "reports", firebaseId);

    await updateDoc(reportRef, {

      status: "resolved"

    });

    loadReports();

  }

  // LOGOUT

  window.logout = function(){

    window.location.href = "index.html";

  }

  // INITIAL LOAD

  loadReports();

</script>
