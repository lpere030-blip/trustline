<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrustLine</title>

<style>

*{box-sizing:border-box;margin:0;padding:0;}

body{
  font-family:Segoe UI,sans-serif;
  background:#f4f6f9;
  color:#1a1a2e;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.staff-btn{
  background:#1a1a2e;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:14px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  margin:10px 0;
}

.submit-btn{
  background:#1a1a2e;
  color:white;
  padding:12px;
  border:none;
  cursor:pointer;
}

/* dashboard */
#staffDashboard{display:none;margin-top:30px;}

.report{
  background:white;
  padding:15px;
  margin:10px 0;
  border:1px solid #ddd;
  border-radius:10px;
}

/* AI */
.ai-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#1a1a2e;
  color:white;
  padding:12px;
  border-radius:50px;
  cursor:pointer;
  z-index:999;
}

.ai-box{
  position:fixed;
  bottom:80px;
  right:20px;
  width:320px;
  height:420px;
  background:white;
  border:1px solid #ccc;
  border-radius:12px;
  display:none;
  flex-direction:column;
  z-index:999;
}

.ai-header{
  background:#1a1a2e;
  color:white;
  padding:10px;
}

.ai-messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:14px;
}

.ai-input{
  display:flex;
}

.ai-input input{
  flex:1;
  padding:10px;
  border:none;
  outline:none;
}

.ai-input button{
  background:#1a1a2e;
  color:white;
  border:none;
  padding:10px;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="topbar">
<h2>TrustLine</h2>
<button class="staff-btn" onclick="openDashboard()">Staff Dashboard</button>
</div>

<div class="container">

<h1>Submit Report</h1>

<input id="name" placeholder="Name">

<select id="type">
<option>Cyberbullying</option>
<option>Verbal Harassment</option>
<option>Physical Bullying</option>
<option>Social Exclusion</option>
<option>Spreading Rumors</option>
<option>Online Threats</option>
<option>Hate Speech</option>
<option>Group Exclusion</option>

<option>Blackmail / Extortion</option>
<option>Impersonation / Fake Account</option>
<option>Harassment in School</option>
<option>Harassment Outside School</option>

<option>Threatening Messages</option>
<option>Repeated Targeting / Bullying</option>
<option>Public Humiliation</option>
<option>Embarrassing Photos Shared Without Permission</option>
<option>Stalking / Following</option>

<option>Discrimination (Race, Gender, Religion)</option>
<option>Gossip Campaign</option>
<option>Excluding from Group Chats</option>

<option>Damage to Property</option>
<option>Physical Intimidation</option>
  <option>ball cleaner</option>

<option>Other</option>
</select>

<input id="location" placeholder="Location">

<textarea id="desc" placeholder="Describe"></textarea>

<button class="submit-btn" onclick="submitReport()">Submit</button>

</div>

<div id="staffDashboard">
<h2>Staff Dashboard</h2>
<div id="reportsContainer"></div>
</div>

<!-- AI BUTTON -->
<div class="ai-btn" onclick="toggleAI()">AI Counselor</div>

<div class="ai-box" id="aiBox">

<div class="ai-header">TrustLine AI Counselor</div>

<div class="ai-messages" id="aiMessages">
<div><b>AI:</b> Hi, I’m here to support you with bullying, stress, or school problems.</div>
</div>

<div class="ai-input">
<input id="aiInput" placeholder="Type a message...">
<button onclick="sendAI()">Send</button>
</div>

</div>

<script>

let reports = JSON.parse(localStorage.getItem("reports")) || [];

/* REPORTS */
function submitReport(){

  const r = {
    id: Date.now(),
    name: document.getElementById("name").value,
    type: document.getElementById("type").value,
    location: document.getElementById("location").value,
    desc: document.getElementById("desc").value,
    status: "new",
    time: new Date().toLocaleString()
  };

  reports.unshift(r);
  localStorage.setItem("reports", JSON.stringify(reports));

  alert("Report submitted!");
  location.reload();
}

/* DASHBOARD */
function openDashboard(){

  const code = prompt("Enter staff code:");
  if(code !== "Doral2025"){
    alert("Wrong code");
    return;
  }

  document.getElementById("staffDashboard").style.display="block";
  renderReports();
}

/* RENDER */
function renderReports(){

  const c = document.getElementById("reportsContainer");

  if(reports.length === 0){
    c.innerHTML = "<div class='report'>No reports yet</div>";
    return;
  }

  c.innerHTML = reports.map(r => `
    <div class="report">
      <b>${r.type}</b><br>
      ${r.desc}<br>
      <small>${r.location} • ${r.time}</small>
    </div>
  `).join("");
}

/* AI */
function toggleAI(){
  const box = document.getElementById("aiBox");
  box.style.display = box.style.display === "flex" ? "none" : "flex";
}

async function sendAI(){

  const input = document.getElementById("aiInput");
  const msg = input.value.trim();
  if(!msg) return;

  const chat = document.getElementById("aiMessages");

  chat.innerHTML += `<div><b>You:</b> ${msg}</div>`;
  input.value = "";

  const res = await fetch("YOUR-BACKEND-URL/chat", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({ message: msg })
  });

  const data = await res.json();

  chat.innerHTML += `<div><b>AI:</b> ${data.reply}</div>`;
}

</script>

</body>
</html>
