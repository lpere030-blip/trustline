<script>
  const sampleReports = [
    { id: 1, type: "Cyberbullying (online)", location: "Online / social media", timing: "This week", desc: "Someone is sending mean messages to a student in our grade on Instagram.", danger: "No, but it needs attention", status: "new", time: "2 hours ago" },
    { id: 2, type: "Verbal harassment", location: "Hallway", timing: "Today", desc: "A group of older students keep making fun of someone near the lockers every morning.", danger: "It keeps happening", status: "new", time: "45 mins ago" },
    { id: 3, type: "Exclusion / social bullying", location: "Cafeteria", timing: "It keeps happening", desc: "A student keeps being told they cannot sit with any group at lunch.", danger: "No, but it needs attention", status: "resolved", time: "Yesterday" }
  ];

  let reports = [...sampleReports];

  function showTab(tab) {

    // PASSWORD PROTECTION FOR STAFF DASHBOARD
    if (tab === 'admin') {
      const code = prompt("Enter staff access code:");

      if (code !== "tungsahur") {
        alert("Incorrect code.");
        return;
      }
    }

    document.getElementById('tab-student').style.display = tab === 'student' ? 'block' : 'none';
    document.getElementById('tab-admin').style.display = tab === 'admin' ? 'block' : 'none';

    document.querySelectorAll('.tab').forEach((t, i) => {
      t.classList.toggle(
        'active',
        (i === 0 && tab === 'student') ||
        (i === 1 && tab === 'admin')
      );
    });

    if (tab === 'admin') renderReports();
  }

  function submitReport() {
    const type = document.getElementById('incident-type').value;
    const desc = document.getElementById('description').value;

    if (!type || !desc.trim()) {
      alert('Please fill in the incident type and description.');
      return;
    }

    const newReport = {
      id: reports.length + 1,
      type,
      location: document.getElementById('location').value || 'Not specified',
      timing: document.getElementById('timing').value || 'Not specified',
      desc,
      danger: document.getElementById('danger').value,
      status: 'new',
      time: 'Just now'
    };

    reports.unshift(newReport);

    document.getElementById('form-card').style.display = 'none';
    document.getElementById('success-card').style.display = 'block';
  }

  function resetForm() {
    document.getElementById('form-card').style.display = 'block';
    document.getElementById('success-card').style.display = 'none';

    document.getElementById('incident-type').value = '';
    document.getElementById('location').value = '';
    document.getElementById('timing').value = '';
    document.getElementById('description').value = '';
    document.getElementById('danger').value = 'No, but it needs attention';
  }

  function markResolved(id) {
    const r = reports.find(r => r.id === id);

    if (r) r.status = 'resolved';

    renderReports();
  }

  function renderReports() {
    const newCount = reports.filter(r => r.status === 'new').length;
    const doneCount = reports.filter(r => r.status === 'resolved').length;

    document.getElementById('stat-total').textContent = reports.length;
    document.getElementById('stat-new').textContent = newCount;
    document.getElementById('stat-done').textContent = doneCount;

    const container = document.getElementById('report-items');

    container.innerHTML = reports.map(r => `
      <div class="report-item">
        <div style="flex:1;">
          <div style="display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap;">
            <span style="font-size:15px; font-weight:600;">${r.type}</span>

            <span class="badge ${r.status === 'new' ? 'badge-new' : 'badge-done'}">
              ${r.status === 'new' ? 'Needs review' : 'Resolved'}
            </span>
          </div>

          <p style="font-size:13px; color:#6b7280; margin-bottom:5px;">
            ${r.location} &middot; ${r.time}
          </p>

          <p style="font-size:14px;">
            ${r.desc}
          </p>

          ${r.danger === 'Yes, please act quickly'
            ? '<p class="urgent">⚠ Immediate attention needed</p>'
            : ''
          }
        </div>

        ${r.status === 'new'
          ? `<button class="btn" style="font-size:12px; padding:7px 14px; white-space:nowrap;" onclick="markResolved(${r.id})">Mark resolved</button>`
          : ''
        }
      </div>
    `).join('');
  }
</script>
