
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TrustLine</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Segoe UI,sans-serif;
  background:#f4f6f9;
  color:#1a1a2e;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.staff-btn{
  background:#1a1a2e;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.staff-btn:hover{
  background:#2d2d4e;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:14px;
  border:1px solid #e5e7eb;
}

h1{
  margin-bottom:20px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:18px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
}

textarea{
  resize:vertical;
}

.submit-btn{
  background:#1a1a2e;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
  font-weight:600;
}

.submit-btn:hover{
  background:#2d2d4e;
}

#staffDashboard{
  display:none;
  margin-top:40px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  border:1px solid #e5e7eb;
}

.stat-number{
  font-size:34px;
  font-weight:700;
  margin-bottom:5px;
}

.stat-label{
  color:#6b7280;
  font-size:14px;
}

.report{
  background:white;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
  border:1px solid #e5e7eb;
}

.report-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.badge{
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge-new{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-resolved{
  background:#dcfce7;
  color:#15803d;
}

.report-info{
  color:#6b7280;
  font-size:13px;
  margin-bottom:10px;
}

.resolve-btn{
  margin-top:12px;
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#1a1a2e;
  color:white;
  cursor:pointer;
}

.resolve-btn:hover{
  background:#2d2d4e;
}

</style>
</head>

<body>

<div class="topbar">
  <h2>TrustLine</h2>

  <button class="staff-btn" onclick="openDashboard()">
    Staff Dashboard
  </button>
</div>

<!-- GUEST FORM -->

<div class="container">

  <h1>Submit a Report</h1>

  <input
    type="text"
    id="name"
    placeholder="Your Name">

  <select id="type">

    <option>Cyberbullying</option>
    <option>Verbal Harassment</option>
    <option>Physical Bullying</option>
    <option>Social Exclusion</option>
    <option>Spreading Rumors</option>
    <option>Online Threats</option>
    <option>Hate Speech</option>
    <option>Group Exclusion</option>
    <option>Blackmail / Extortion</option>
    <option>Harassment in School</option>
    <option>Harassment Outside School</option>
    <option>ball cleaner</option>

    <option>Other</option>

  </select>

  <input
    type="text"
    id="location"
    placeholder="Location">

  <textarea
    id="desc"
    rows="5"
    placeholder="Describe what happened"></textarea>

  <button
    class="submit-btn"
    onclick="submitReport()">

    Submit Report

  </button>

</div>

<!-- STAFF DASHBOARD -->

<div id="staffDashboard">

  <h1 style="margin-bottom:20px;">
    Staff Dashboard
  </h1>

  <div class="stats">

    <div class="card">
      <div class="stat-number" id="totalReports">0</div>
      <div class="stat-label">Total Reports</div>
    </div>

    <div class="card">
      <div
        class="stat-number"
        style="color:#b91c1c;"
        id="newReports">
        0
      </div>

      <div class="stat-label">
        Need Review
      </div>
    </div>

    <div class="card">
      <div
        class="stat-number"
        style="color:#15803d;"
        id="resolvedReports">
        0
      </div>

      <div class="stat-label">
        Resolved
      </div>
    </div>

  </div>

  <div id="reportsContainer"></div>

</div>

<script>

let reports =
  JSON.parse(localStorage.getItem("reports")) || [];

/* SUBMIT REPORT */

function submitReport(){

  const report = {

    id: Date.now(),

    name:
      document.getElementById("name").value,

    type:
      document.getElementById("type").value,

    location:
      document.getElementById("location").value,

    desc:
      document.getElementById("desc").value,

    status:"new",

    time:new Date().toLocaleString()

  };

  reports.unshift(report);

  localStorage.setItem(
    "reports",
    JSON.stringify(reports)
  );

  alert("Report submitted successfully.");

  location.reload();

}

/* OPEN STAFF DASHBOARD */

function openDashboard(){

  const access =
    prompt("Enter staff access code:");

  if(access !== "Doral2025"){

    alert("Access denied.");
    return;

  }

  document.getElementById(
    "staffDashboard"
  ).style.display = "block";

  renderReports();

  window.scrollTo({
    top: document.body.scrollHeight,
    behavior:"smooth"
  });

}

/* RENDER REPORTS */

function renderReports(){

  const container =
    document.getElementById("reportsContainer");

  const newCount =
    reports.filter(r => r.status === "new").length;

  const resolvedCount =
    reports.filter(
      r => r.status === "resolved"
    ).length;

  document.getElementById(
    "totalReports"
  ).textContent = reports.length;

  document.getElementById(
    "newReports"
  ).textContent = newCount;

  document.getElementById(
    "resolvedReports"
  ).textContent = resolvedCount;

  if(reports.length === 0){

    container.innerHTML = `
      <div class="report">
        No reports submitted yet.
      </div>
    `;

    return;

  }

  container.innerHTML =
    reports.map(report => `

      <div class="report">

        <div class="report-top">

          <strong>${report.type}</strong>

          <span class="badge ${
            report.status === "new"
            ? "badge-new"
            : "badge-resolved"
          }">

            ${
              report.status === "new"
              ? "Needs Review"
              : "Resolved"
            }

          </span>

        </div>

        <div class="report-info">
          ${report.location} • ${report.time}
        </div>

        <div style="margin-bottom:10px;">
          ${report.desc}
        </div>

        <div class="report-info">
          Submitted by: ${report.name}
        </div>

        ${
          report.status === "new"
          ? `
            <button
              class="resolve-btn"
              onclick="resolveReport(${report.id})">

              Mark Resolved

            </button>
          `
          : ""
        }

      </div>

    `).join("");

}

/* RESOLVE REPORT */

function resolveReport(id){

  const report =
    reports.find(r => r.id === id);

  if(report){

    report.status = "resolved";

    localStorage.setItem(
      "reports",
      JSON.stringify(reports)
    );

    renderReports();

  }

}

</script>

</body>
</html>
