<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TrustLine Reporting System</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Segoe UI, sans-serif;
  background:#f4f6f9;
  color:#1a1a2e;
  padding:25px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.staff-btn{
  background:#1a1a2e;
  color:white;
  border:none;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.staff-btn:hover{
  background:#2d2d4e;
}

.container{
  max-width:800px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:14px;
  border:1px solid #e5e7eb;
}

.subtitle{
  color:#6b7280;
  margin-bottom:20px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  margin-top:8px;
  margin-bottom:18px;
  border:1px solid #d1d5db;
  border-radius:8px;
}

textarea{
  resize:vertical;
}

.submit-btn{
  background:#1a1a2e;
  color:white;
  border:none;
  padding:12px 20px;
  border-radius:8px;
  cursor:pointer;
}

.submit-btn:hover{
  background:#2d2d4e;
}

#staffDashboard{
  display:none;
  margin-top:50px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:20px;
}

.stat-number{
  font-size:32px;
  font-weight:bold;
}

.stat-label{
  color:#6b7280;
}

.report{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:18px;
  margin-bottom:15px;
}

.report-info{
  color:#6b7280;
  font-size:13px;
  margin-top:5px;
}

.badge{
  padding:5px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:600;
}

.badge-new{
  background:#fee2e2;
  color:#b91c1c;
}

.badge-resolved{
  background:#dcfce7;
  color:#15803d;
}

.report-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.resolve-btn{
  margin-top:12px;
  padding:8px 14px;
  border:none;
  border-radius:8px;
  background:#1a1a2e;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>

<div class="topbar">
  <h2>TrustLine</h2>

  <button class="staff-btn" onclick="openDashboard()">
    Staff Dashboard
  </button>
</div>

<div class="container">

  <h1>Submit a Report</h1>

  <p class="subtitle">
    Help make your school a safer place.
    Anonymous reports are allowed.
  </p>

  <input type="text" id="name" placeholder="Your Name (Optional)">

  <input type="text" id="victim" placeholder="Who is being bullied?">

  <input type="text" id="bully" placeholder="Who is responsible?">

  <select id="type">
    <option>Cyberbullying</option>
    <option>Verbal Harassment</option>
    <option>Social Exclusion</option>
    <option>Physical Bullying</option>
    <option>Threats or Intimidation</option>
    <option>Rumors or Gossip</option>
    <option>Discrimination</option>
    <option>Other</option>
  </select>

  <select id="severity">
    <option>Low Severity</option>
    <option>Medium Severity</option>
    <option>High Severity</option>
    <option>Emergency</option>
  </select>

  <input type="text" id="location" placeholder="Location">

  <input type="date" id="date">

  <textarea
    id="desc"
    rows="5"
    placeholder="Describe what happened"></textarea>

  <textarea
    id="evidence"
    rows="3"
    placeholder="Evidence, usernames, links, screenshots, etc."></textarea>

  <button class="submit-btn" onclick="submitReport()">
    Submit Report
  </button>

</div>

<div id="staffDashboard">

  <h1 style="margin:30px 0 20px;">
    Staff Dashboard
  </h1>

  <div class="stats">

    <div class="card">
      <div class="stat-number" id="totalReports">0</div>
      <div class="stat-label">Total Reports</div>
    </div>

    <div class="card">
      <div class="stat-number" id="newReports">0</div>
      <div class="stat-label">Need Review</div>
    </div>

    <div class="card">
      <div class="stat-number" id="resolvedReports">0</div>
      <div class="stat-label">Resolved</div>
    </div>

  </div>

  <div id="reportsContainer"></div>

</div>

<script>

let reports =
  JSON.parse(localStorage.getItem("reports")) || [];

function submitReport(){

  const report = {

    id: Date.now(),

    name:
      document.getElementById("name").value || "Anonymous",

    victim:
      document.getElementById("victim").value,

    bully:
      document.getElementById("bully").value,

    type:
      document.getElementById("type").value,

    severity:
      document.getElementById("severity").value,

    location:
      document.getElementById("location").value,

    date:
      document.getElementById("date").value,

    desc:
      document.getElementById("desc").value,

    evidence:
      document.getElementById("evidence").value,

    status:"new",

    time:new Date().toLocaleString()

  };

  reports.unshift(report);

  localStorage.setItem(
    "reports",
    JSON.stringify(reports)
  );

  alert("Report submitted successfully.");

  location.reload();
}

function openDashboard(){

  const access =
    prompt("Enter staff access code:");

  if(access !== "tungsahur"){

    alert("Access denied.");
    return;

  }

  document.getElementById(
    "staffDashboard"
  ).style.display = "block";

  renderReports();

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });
}

function renderReports(){

  const container =
    document.getElementById("reportsContainer");

  const newCount =
    reports.filter(r => r.status === "new").length;

  const resolvedCount =
    reports.filter(r => r.status === "resolved").length;

  document.getElementById("totalReports").textContent =
    reports.length;

  document.getElementById("newReports").textContent =
    newCount;

  document.getElementById("resolvedReports").textContent =
    resolvedCount;

  if(reports.length === 0){

    container.innerHTML =
      "<div class='report'>No reports submitted yet.</div>";

    return;
  }

  container.innerHTML = reports.map(report => `

    <div class="report">

      <div class="report-top">

        <strong>${report.type}</strong>

        <span class="badge ${
          report.status === "new"
          ? "badge-new"
          : "badge-resolved"
        }">

          ${
            report.status === "new"
            ? "Needs Review"
            : "Resolved"
          }

        </span>

      </div>

      <div>${report.desc}</div>

      <div class="report-info">
        Submitted By: ${report.name}
      </div>

      <div class="report-info">
        Victim: ${report.victim}
      </div>

      <div class="report-info">
        Reported Person: ${report.bully}
      </div>

      <div class="report-info">
        Severity: ${report.severity}
      </div>

      <div class="report-info">
        Location: ${report.location}
      </div>

      <div class="report-info">
        Date: ${report.date}
      </div>

      <div class="report-info">
        Evidence: ${report.evidence || "None"}
      </div>

      <div class="report-info">
        Submitted: ${report.time}
      </div>

      ${
        report.status === "new"
        ? `
          <button
            class="resolve-btn"
            onclick="resolveReport(${report.id})">
            Mark Resolved
          </button>
        `
        : ""
      }

    </div>

  `).join("");
}

function resolveReport(id){

  const report =
    reports.find(r => r.id === id);

  if(report){

    report.status = "resolved";

    localStorage.setItem(
      "reports",
      JSON.stringify(reports)
    );

    renderReports();
  }
}

</script>

</body>
</html>
